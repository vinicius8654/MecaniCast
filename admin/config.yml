backend:
  name: git-gateway
  branch: main # ou master, dependendo de como está no seu GitHub

media_folder: "img" # Onde as imagens do painel serão salvas
public_folder: "img"

collections:
  - name: "episodios"
    label: "Episódios"
    folder: "dados/episodios" # O CMS vai criar arquivos .json aqui
    create: true
    extension: "json"
    format: "json"
    fields:
      - {label: "Título", name: "titulo", widget: "string"}
      - {label: "Data", name: "data", widget: "datetime"}
      - {label: "Capa do Episódio", name: "imagem", widget: "image"}
      - {label: "Descrição", name: "descricao", widget: "text"}